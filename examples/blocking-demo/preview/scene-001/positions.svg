<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="1244" viewBox="0 0 1312 1244" role="img"><title>场景角色站位与走位待审图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="24" y="32" font-size="14" fill="#172033">SC01 / 咖啡店·空间示意 / 角色站位图</text><text x="24" y="54" font-size="14" fill="#172033">示意坐标 (relative)；依据：根据虚构原文确定南侧门口、中部桌子；距离仅为相对示意，非实测。</text><text x="24" y="76" font-size="14" fill="#172033">needs_manual_review / 待人工审核：剧情关联、连续性及图面可读性。N 为图面北向；x 向右，y 向上；朝向 0°=东，90°=北。</text><text x="24" y="98" font-size="14" fill="#172033">图例：实心=入镜状态，空心=出镜状态，虚线圈=画外；箭头=移动方向；CAM=机位。</text><text x="24" y="120" font-size="14" fill="#be123c">A: 林晓</text><text x="24" y="142" font-size="14" fill="#1d4ed8">B: 周衡</text><text x="24" y="164" font-size="14" fill="#172033">地标 1: 桌子 (table)</text><text x="24" y="186" font-size="14" fill="#172033">地标 2: 入口 (door)</text><text x="24" y="224" font-size="14" fill="#172033">原镜 1 | S001 | 3s</text><text x="24" y="246" font-size="14" fill="#172033">依据 [action] 林晓坐在桌旁看手机，周衡停在门内。两人均原地不动。</text><text x="24" y="282" font-size="14" fill="#172033">ENTRY / 起始站位</text><rect x="78" y="328" width="492" height="328" fill="#fbfcff" stroke="#6b7280"/><text x="596" y="304" font-size="14" fill="#172033">N ↑</text><rect x="221.5" y="471.5" width="41" height="41" fill="#dce2eb" stroke="#657086"/><text x="224.5" y="486.5" font-size="12" fill="#172033">1</text><rect x="293.25" y="629.35" width="61.5" height="20.5" fill="#dce2eb" stroke="#657086"/><text x="296.25" y="644.35" font-size="12" fill="#172033">2</text><path d="M 78,656 L 291.2,656" stroke="#172033" stroke-width="4"/><path d="M 356.8,656 L 570,656" stroke="#172033" stroke-width="4"/><path d="M 570,656 L 570,328" stroke="#172033" stroke-width="4"/><path d