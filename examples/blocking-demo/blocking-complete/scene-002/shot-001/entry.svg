<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="984" viewBox="0 0 1100 984" role="img"><title>场景调度待人工审核</title><rect width="100%" height="100%" fill="white"/><text x="24.000000" y="20.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">SC02 | ENTRY / 每镜起始站位</text><text x="24.000000" y="47.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">原镜 3 | S003 | 2s | 店外街道·无人场景</text><text x="24.000000" y="74.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">schematic / relative；依据：虚构原镜的无人外景；只示意店面与门前空地。</text><text x="24.000000" y="101.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">needs_manual_review / 待人工审核；坐标 x 向右、y 向上；0°东 / 90°北；N↑</text><text x="24.000000" y="128.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">实心=ENTRY，空心=EXIT；虚线边框+OFF=画外；箭头=朝向/路径；CAM=机位</text><text x="24.000000" y="155.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">固定角色编号跨场不变；X=EXIT；E=X=首末相同；R=走位段</text><text x="24.000000" y="182.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">身份=颜色＋形状＋编号；图例短线表示该角色的走位线型</text><text x="24.000000" y="209.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">标识表 blocking-demo / r1 / SHA256 a6626639020c…</text><text x="24.000000" y="236.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">地标 1: 咖啡店外墙 (facade) / 阻挡</text><rect x="100.000000" y="288.000000" width="900.000000" height="600.000000" fill="#fbfcff" stroke="#64748b" stroke-width="2"/><text x="1015.000000" y="264.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">N ↑</text><rect x="325.000000" y="325.500000" width="450.000000" height="75.000000" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><text x="328.000000" y="328.500000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="15" fill="#172033">1</text><polygon data-marker-shape="square" points="540.000000,803.000000 560.000000,803.000000 560.000000,823.000000 540.000000,823.000000" fill="#475569"/><polyline points="540.000000,803.000000 560.000000,803.000000" fill="none" stroke="#475569" stroke-width="2"/><polyline points="560.000000,803.000000 560.000000,823.000000" fill="none" stroke="#475569" stroke-width="2"/><polyline points="560.000000,823.000000 540.000000,823.000000" fill="none" stroke="#475569" stroke-width="2"/><polyline points="540.000000,823.000000 540.000000,803.000000" fill="none" stroke="#475569" stroke-width="2"/><polyline points="550.000000,813.000000 550.000000,788.000000" fill="none" stroke="#475569" stroke-width="2"/><polygon points="550.000000,788.000000 553.914690,796.104024 546.085310,796.104024" fill="#475569"/><text x="566.000000" y="785.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="15" fill="#172033">CAM CAM_EXT</text><text x="24.000000" y="933.000000" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#172033">依据 [action] 切到店外街道空镜，门前无人。</text></svg>